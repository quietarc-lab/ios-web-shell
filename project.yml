name: MiniBrowser

options:
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  MiniBrowser:
    type: application
    platform: iOS
    sources:
      - path: MiniBrowser
        excludes:
          - Info.plist
    dependencies:
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sidestore.MiniBrowser
        PRODUCT_NAME: MiniBrowser
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MiniBrowser/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

  MiniBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiniBrowserTests
    dependencies:
      - target: MiniBrowser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MiniBrowserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MiniBrowserUITests
    dependencies:
      - target: MiniBrowser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MiniBrowser:
    build:
      targets:
        MiniBrowser: all
    test:
      targets:
        - MiniBrowserTests
        - MiniBrowserUITests
